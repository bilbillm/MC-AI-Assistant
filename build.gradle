plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = mod_group
version = mod_version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Auto-deploy: copy built JAR to Minecraft mods folder
tasks.register('deployToMods', Copy) {
    dependsOn build
    from layout.buildDirectory.file("libs/${mod_id}-${mod_version}.jar")
    into "D:/MC/.minecraft/versions/1.21.1-NeoForge_21.1.219/mods"
    rename { "${mod_id}-${mod_version}.jar" }
    doLast {
        println ">> Deployed ${mod_id}-${mod_version}.jar to mods folder"
    }
}

// Generate mod metadata from templates
tasks.named('processResources', ProcessResources) {
    var expandProperties = [
            'mod_id'          : mod_id,
            'mod_name'        : mod_name,
            'mod_version'     : mod_version,
            'mod_group'       : mod_group,
            'minecraft_version': minecraft_version,
            'neo_version'     : neo_version,
    ]
    inputs.properties(expandProperties)
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand(expandProperties)
    }
}
